name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build all platforms
        run: |
          make bin/tabl.linux_amd64
          make bin/tabl.linux_arm64
          make bin/tabl.macos_amd64
          make bin/tabl.macos_arm64
          make bin/tabl.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/tabl.linux_amd64
            bin/tabl.linux_arm64
            bin/tabl.macos_amd64
            bin/tabl.macos_arm64
            bin/tabl.exe
